<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Image Archivist card art</title>
<style>
  /*
    The card artwork, composed rather than cropped.

    The portfolio's card has no fixed aspect: it runs about 1.61:1 at
    1440x900 and 2.11:1 at 1920x1080, and object-fit cover eats the
    difference. So this frame carries its own margin, the way the
    building-a-startup lanyard cut does: the product sits centred with air
    on every side, and cover can take a quarter of the height off a wide
    monitor without touching it.

    Everything here is monochrome. The float comes from a dark product on a
    pale ground, which is the one thing a dark ground cannot do.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1392px; overflow: hidden; background: #ffffff; }

  .ground {
    position: relative;
    width: 1920px; height: 1392px;
    display: grid; place-items: center;
    background: #ffffff;
  }
  /* a faint rule, so the ground reads as a surface and not as empty space */
  .ground::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.085) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.085) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(62% 58% at 50% 47%, #000 14%, transparent 70%);
    mask-image: radial-gradient(62% 58% at 50% 47%, #000 14%, transparent 70%);
  }

  .frame {
    position: relative;
    width: 1600px;                 /* 83% of the frame, 160px of ground either side */
    border-radius: 14px;
    overflow: hidden;
    background: #020202;
    border: 1px solid rgba(0,0,0,0.18);
    box-shadow:
      0 18px 34px -18px rgba(0,0,0,0.26),
      0 6px 12px -8px rgba(0,0,0,0.18);
  }
  .frame video { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="ground">
    <div class="frame">
      <video id="film" src="/image-archivist.mp4" muted playsinline></video>
    </div>
  </div>
<script>
  /* the recorder drives playback: it starts the clip and reads currentTime
     to know when one full pass is done, so the capture is exactly one loop */
  const v = document.getElementById("film");
  window.__ready = false;
  v.addEventListener("loadeddata", () => { window.__ready = true; });
  /* Seeking blanks a <video> for a compositor frame or two, and a recorder that starts rolling
     before the first frame is presented catches the bare ground: one white frame at the head of
     the clip, which is a flash every time the card loops. So resolve only once a real frame has
     been painted. requestVideoFrameCallback is the only thing that actually knows. */
  window.__play = async () => {
    v.currentTime = 0;
    await v.play();
    await new Promise((r) => {
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => r());
      else setTimeout(r, 150);
    });
  };
  window.__at = () => v.currentTime;
  window.__len = () => v.duration;
</script>
</body>
</html>
