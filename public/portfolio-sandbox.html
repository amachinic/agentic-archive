<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — Image Archivist card</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<style>
  /* The portfolio and Atlas ship the same design system -- same faces, same
     neutral ramp, same green. Nothing below invents a value; it only builds
     the one card that does not exist yet. */
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Lite.ttf") format("truetype"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Reg.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Med.otf") format("opentype"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Input Mono"; src: url("/fonts/InputMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }

  :root {
    --neutral-950: #020202; --neutral-900: #0d0d0d; --neutral-800: #1a1a1a;
    --neutral-700: #3a3a3a; --neutral-600: #555; --neutral-500: #7b7b7b;
    --neutral-400: #999;    --neutral-200: #e8e8e8; --neutral-100: #f0f0f0;
    --accent: #7ebb1c; --accent-wash: rgba(126,187,28,0.15);
    --bg: var(--neutral-950); --surface: var(--neutral-900);
    --text-primary: var(--neutral-100); --text-secondary: var(--neutral-400);
    --text-muted: var(--neutral-500); --border: rgba(255,255,255,0.10);
    --font-sans: "Neue Haas Unica", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Input Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 6px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); font-weight: 300; }
  body { -webkit-font-smoothing: antialiased; }

  /* ---- the split: a fixed rail of words, a scrolling column of work ---- */
  .split { display: grid; grid-template-columns: minmax(380px, 34vw) 1fr; min-height: 100vh; }

  .rail {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
    padding: 34px 44px 30px; overflow: hidden;
  }
  .rail__clock, .rail__foot {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .rail__intro { margin-top: auto; padding-bottom: 46px; }
  .rail__intro p { font-size: clamp(19px, 1.6vw, 25px); line-height: 1.42; color: var(--text-secondary); font-weight: 300; }
  .rail__intro p + p { margin-top: 18px; }
  .rail__intro b { font-weight: 300; color: var(--text-primary); border-bottom: 1px solid var(--neutral-600); }
  .rail__foot { margin-top: auto; }

  /* ---- the project list: a hairline the active row claims ---- */
  .list { border-left: 1px solid var(--border); margin-bottom: auto; }
  .row { position: relative; padding: 0 0 0 18px; }
  .row::before {
    content: ""; position: absolute; left: -1px; top: 2px; bottom: 2px; width: 1px;
    background: var(--text-primary); transform: scaleY(0); transform-origin: 50% 50%;
    transition: transform 260ms var(--ease);
  }
  .row.is-open::before { transform: scaleY(1); }
  .row__head {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 0; cursor: pointer; background: none; border: 0; width: 100%;
    text-align: left; font-family: inherit;
  }
  .row__title { font-size: 16.5px; font-weight: 300; color: var(--text-muted); transition: color 200ms var(--ease); }
  .row.is-open .row__title, .row__head:hover .row__title { color: var(--text-primary); }
  .row__cta {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px 9px 3px;
    opacity: 0; transform: translateX(-4px);
    transition: opacity 200ms var(--ease), transform 200ms var(--ease), color 200ms var(--ease), border-color 200ms var(--ease);
  }
  .row.is-open .row__cta { opacity: 1; transform: none; }
  .row__cta:hover { color: var(--accent); border-color: var(--accent); }
  .row__cta.is-new { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  /* the description belongs to the open row only, and grows into place */
  .row__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 300ms var(--ease); }
  .row.is-open .row__body { grid-template-rows: 1fr; }
  .row__body > div { overflow: hidden; }
  .row__desc {
    font-size: 13.5px; line-height: 1.6; color: var(--text-muted);
    padding: 2px 26px 16px 0; max-width: 44ch;
  }
  .row__meta {
    display: flex; align-items: center; gap: 9px; padding-bottom: 14px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--neutral-600);
  }

  /* ---- the media column ---- */
  .work { padding: 22px 22px 22px 0; display: flex; flex-direction: column; gap: 22px; }
  .media { border-radius: 14px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); }
  .media--plain { aspect-ratio: 16 / 10; display: grid; place-items: center; color: var(--neutral-700); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

  /*
    The card the video lives in.

    The reference sets a product inside a scene rather than cropping to it:
    a tinted ground, generous air on every side, and the artefact lifted off
    that ground on a shadow. Everything here serves that one read -- the
    ground is a soft wash so the near-black UI has something to sit against,
    the padding is deliberately larger than feels necessary, and the shadow
    is what makes it float rather than sit.
  */
  .stage {
    position: relative;
    padding: clamp(28px, 4.4vw, 68px);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: background 320ms var(--ease);
  }
  /* the grid rides its own layer so the ground and the ruling can vary
     independently -- and so the ruling can be masked into a gradient */
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: var(--grid, 46px) var(--grid, 46px);
    -webkit-mask-image: var(--fade);
    mask-image: var(--fade);
  }

  /* ---------- ground variants ----------
     All monochrome. Each sets three things and nothing else: the ground it
     paints, the colour of the ruling, and how that ruling fades out. */

  /* 1 · light ground, dark ruling -- the reference's arrangement: a dark
     product on a pale card, which is where the float comes from */
  .stage[data-bg="paper"] {
    --line: rgba(0,0,0,0.10); --grid: 44px;
    --fade: radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 82%);
    background: linear-gradient(160deg, #f4f4f4 0%, #e4e4e4 52%, #d2d2d2 100%);
  }
  /* 2 · dark ground, light ruling */
  .stage[data-bg="slate"] {
    --line: rgba(255,255,255,0.055); --grid: 46px;
    --fade: radial-gradient(120% 100% at 50% 0%, #000 25%, transparent 78%);
    background: linear-gradient(160deg, #2e2e2e 0%, #222 46%, #171717 100%);
  }
  /* 3 · the ground itself runs black to white across the diagonal, and the
     ruling flips with it: dark lines on the light end, light on the dark */
  .stage[data-bg="sweep"] {
    --line: rgba(128,128,128,0.34); --grid: 44px;
    --fade: linear-gradient(120deg, #000 0%, #000 100%);
    background: linear-gradient(120deg, #050505 0%, #1d1d1d 34%, #8a8a8a 74%, #ededed 100%);
  }
  /* 4 · the ruling is the gradient: white where it starts, gone by the far
     corner, over a flat ground */
  .stage[data-bg="fade"] {
    --line: rgba(255,255,255,0.16); --grid: 40px;
    --fade: linear-gradient(115deg, #000 0%, rgba(0,0,0,0.55) 38%, transparent 82%);
    background: #101010;
  }
  /* 5 · graph paper: a fine rule inside a coarse one */
  .stage[data-bg="graph"] {
    --line: rgba(255,255,255,0.05); --grid: 13px;
    --fade: radial-gradient(120% 110% at 50% 10%, #000 35%, transparent 85%);
    background: linear-gradient(160deg, #232323 0%, #171717 60%, #101010 100%);
  }
  .stage[data-bg="graph"]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size: 78px 78px;
    -webkit-mask-image: var(--fade);
    mask-image: var(--fade);
  }
  /* 6 · no ruling at all, just a ground */
  .stage[data-bg="plain"] {
    --line: transparent; --fade: none;
    background: linear-gradient(160deg, #262626 0%, #161616 100%);
  }
  .stage__frame {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #020202;
    border: 1px solid rgba(255,255,255,0.13);
    /* the float: a long, soft shadow plus a tight contact one */
    box-shadow:
      0 42px 80px -28px rgba(0,0,0,0.92),
      0 14px 28px -14px rgba(0,0,0,0.75),
      0 2px 0 0 rgba(255,255,255,0.04) inset;
  }
  .stage__frame video { display: block; width: 100%; height: auto; }

  /* the light ground needs the frame edge to invert, or a white hairline
     disappears into a near-white card */
  .stage[data-bg="paper"] .stage__frame { border-color: rgba(0,0,0,0.16); }

  /* ---- sandbox chrome: not part of the site ---- */
  .note {
    position: fixed; left: 12px; bottom: 12px; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border: 1px dashed var(--neutral-700); border-radius: 10px;
    background: rgba(2,2,2,0.86); backdrop-filter: blur(8px);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--neutral-500);
  }
  .note button {
    font: inherit; text-transform: inherit; letter-spacing: inherit;
    background: none; color: var(--text-secondary); border: 1px solid var(--neutral-700);
    border-radius: 5px; padding: 3px 8px 2px; cursor: pointer;
  }
  .note button:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 900px) {
    .split { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; padding: 24px; }
    .work { padding: 0 16px 24px; }
  }
</style>
</head>
<body>

<div class="split">
  <aside class="rail">
    <div class="rail__clock" id="clock">Toronto, ON</div>

    <div class="rail__intro">
      <p>Hey, I&rsquo;m <b>Matthew Ahn</b>.</p>
      <p>I&rsquo;m a <b>designer</b> focused on building meaningful <b>experiences</b> that bridge business, technology, and humanity.</p>
    </div>

    <div class="list" id="list"></div>

    <div class="rail__foot">Matthew Ahn &copy; 2026</div>
  </aside>

  <main class="work" id="work"></main>
</div>

<div class="note">
  <span>ground</span>
  <span id="bgs"></span>
  <button id="replay">Replay</button>
  <button id="toggle">Rows</button>
</div>

<script>
/*
  One card, first in the list. Everything else is here only so the new one can
  be judged in company rather than on a blank page -- the other five carry the
  copy that is already on the site.
*/
const PROJECTS = [
  {
    id: "image-archivist",
    title: "Image Archivist",
    kind: "Product Design · AI",
    meta: "2026 · Built end to end",
    cta: "View",
    isNew: true,
    desc: "Built a multi-agentic image archive that helps you organize, curate and manage thousands of visual references. One agent works through three lenses to name each image, connect what belongs together, and file it where it lives.",
    video: "/image-archivist.mp4",
  },
  { id: "td", title: "TD Easy Apply", kind: "Product Design", meta: "2022–2026", cta: "Password",
    desc: "Led end-to-end design across TD’s onboarding funnel, reducing journey friction and helping drive its highest completion and customer-profile creation rates in four years." },
  { id: "discovery", title: "Rethinking Product Discovery", kind: "Design Research", meta: "2 months", cta: "View",
    desc: "A 51-participant study comparing form and conversational shopping that reshaped the product direction around how people actually evaluate and trust recommendations." },
  { id: "nvidia", title: "NVIDIA 2026 Hackathon Winner", kind: "Product Design", meta: "3 days", cta: "View",
    desc: "Built a computer-vision triage tool that helps cities prioritize road repairs by ranking defects by the cost of leaving them unresolved. Built in three days, it won first place." },
  { id: "startup", title: "Building a Startup Case Study", kind: "Product Design", meta: "2026", cta: "Under construction",
    desc: "Building a startup from the ground up: strategy, front-end, back-end, and the client conversations in between, scaling a business to meet real demand." },
  { id: "playground", title: "Design Playground", kind: "Art Direction", meta: "2026", cta: "View",
    desc: "Past work and playground ideas." },
];

const list = document.getElementById("list");
const work = document.getElementById("work");

PROJECTS.forEach((p, i) => {
  const row = document.createElement("div");
  row.className = "row" + (i === 0 ? " is-open" : "");
  row.dataset.id = p.id;
  row.innerHTML =
    '<button class="row__head">' +
      '<span class="row__title">' + p.title + '</span>' +
      '<span class="row__cta' + (p.isNew ? " is-new" : "") + '">' + p.cta + '</span>' +
    '</button>' +
    '<div class="row__body"><div>' +
      '<div class="row__meta"><span>' + p.kind + '</span><span style="opacity:.45">/</span><span>' + p.meta + '</span></div>' +
      '<p class="row__desc">' + p.desc + '</p>' +
    '</div></div>';
  row.querySelector(".row__head").onclick = () => {
    const open = row.classList.contains("is-open");
    document.querySelectorAll(".row").forEach((r) => r.classList.remove("is-open"));
    if (!open) row.classList.add("is-open");
  };
  list.appendChild(row);
});

/* the media column: the new project's stage first, the rest as placeholders
   so the eye can judge the card against the rhythm it has to live in */
const hero = document.createElement("div");
hero.className = "stage";
hero.dataset.bg = "paper";
hero.innerHTML =
  '<div class="stage__frame">' +
    '<video id="film" src="/image-archivist.mp4" autoplay muted loop playsinline></video>' +
  '</div>';
work.appendChild(hero);

PROJECTS.slice(1).forEach((p) => {
  const d = document.createElement("div");
  d.className = "media media--plain";
  d.textContent = p.title;
  work.appendChild(d);
});

/* the site prints a live Toronto clock in the rail */
const clock = document.getElementById("clock");
setInterval(() => {
  const t = new Date().toLocaleTimeString("en-US", { timeZone: "America/Toronto", hour12: true });
  clock.textContent = "Toronto, ON  " + t;
}, 1000);

/* the six grounds, switchable so they can be judged against the same video
   rather than against a description of each other */
const GROUNDS = [
  ["paper", "Paper — light ground, dark rule"],
  ["slate", "Slate — dark ground, light rule"],
  ["sweep", "Sweep — black to white across the diagonal"],
  ["fade",  "Fade — the rule itself is the gradient"],
  ["graph", "Graph — fine rule inside a coarse one"],
  ["plain", "Plain — no rule"],
];
const bgs = document.getElementById("bgs");
GROUNDS.forEach(([key, label]) => {
  const btn = document.createElement("button");
  btn.textContent = key;
  btn.title = label;
  btn.style.marginRight = "4px";
  btn.onclick = () => {
    hero.dataset.bg = key;
    [...bgs.children].forEach((c) => (c.style.color = ""));
    btn.style.color = "var(--accent)";
    btn.style.borderColor = "var(--accent)";
    [...bgs.children].forEach((c) => { if (c !== btn) c.style.borderColor = ""; });
  };
  bgs.appendChild(btn);
});
bgs.firstChild.style.color = "var(--accent)";
bgs.firstChild.style.borderColor = "var(--accent)";

/* 1-6 flips grounds from the keyboard, for comparing without the mouse */
addEventListener("keydown", (e) => {
  const i = Number(e.key) - 1;
  if (i >= 0 && i < GROUNDS.length) bgs.children[i].click();
});

document.getElementById("replay").onclick = () => {
  const v = document.getElementById("film");
  v.currentTime = 0; v.play();
};
document.getElementById("toggle").onclick = () => {
  const rows = [...document.querySelectorAll(".row")];
  const i = rows.findIndex((r) => r.classList.contains("is-open"));
  rows.forEach((r) => r.classList.remove("is-open"));
  rows[(i + 1) % rows.length].classList.add("is-open");
};
</script>
</body>
</html>
