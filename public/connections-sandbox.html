<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas — connections sandbox</title>
<style>
  /*
    A stand at the right height, and nothing else.

    This frames the REAL page at /agents/connections rather than reproducing
    it, so it cannot drift: whatever ships is what shows here. What it adds is
    the two things awkward to check inside the running app -- the other theme,
    and the narrow breakpoint where the three readouts stop being columns --
    without navigating the dashboard to get to them.

    The app is laid out at 1500x940. The frame is held at its chosen width and
    scaled down to fit, so the page inside is never resized and never reflows
    into a layout the app would not actually produce.
  */
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Lite.ttf") format("truetype"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Reg.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Input Mono"; src: url("/fonts/InputMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }

  :root {
    --bg: #020202; --surface: #0d0d0d; --raised: #1a1a1a;
    --border: rgba(255,255,255,0.10); --border-strong: #555;
    --text: #f0f0f0; --text-2: #a3a3a3; --text-3: #7b7b7b;
    --accent: #ffffff; --on-accent: #020202;
    --sans: "Neue Haas Unica", Helvetica, Arial, sans-serif;
    --mono: "Input Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  html[data-theme="light"] {
    --bg: #f8f8f8; --surface: #ffffff; --raised: #ffffff;
    --border: #e8e8e8; --border-strong: #c0c0c0;
    --text: #1a1a1a; --text-2: #555555; --text-3: #7b7b7b;
    --accent: #020202; --on-accent: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-weight: 300;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex: none;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-weight: 400; font-size: 15px; letter-spacing: -0.01em; }
  .brand span {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--text-3);
  }

  .group { display: flex; align-items: center; gap: 8px; }
  .group > label {
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--text-3);
  }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: none; border: 0; cursor: pointer;
    padding: 6px 11px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em;
    color: var(--text-2);
    transition: background 140ms var(--ease), color 140ms var(--ease);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .spacer { margin-left: auto; }
  .readout {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  a.open {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    color: var(--text-2); text-decoration: none;
    border: 1px solid var(--border); border-radius: 5px; padding: 6px 10px;
  }
  a.open:hover { color: var(--text); border-color: var(--border-strong); }

  .stage {
    flex: 1; min-height: 0;
    display: grid; place-items: start center;
    padding: 24px;
    overflow: auto;
    background:
      linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 100% 48px,
      var(--bg);
  }
  .vp {
    position: relative;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .vp iframe {
    position: absolute; top: 0; left: 0;
    border: 0;
    transform-origin: 0 0;
    background: var(--bg);
  }
  .note {
    max-width: 62ch; margin: 18px auto 0;
    font-size: 12.5px; line-height: 1.55; color: var(--text-3);
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <b>Connections</b>
    <span>sandbox</span>
  </div>

  <div class="group">
    <label for="t-dark">Theme</label>
    <div class="seg" role="group" aria-label="Theme">
      <button id="t-dark" data-theme-set="dark" aria-pressed="true">dark</button>
      <button data-theme-set="light" aria-pressed="false">light</button>
    </div>
  </div>

  <div class="group">
    <label for="w-1500">Width</label>
    <div class="seg" role="group" aria-label="Frame width">
      <button id="w-1500" data-w="1500" aria-pressed="true">1500</button>
      <button data-w="1100" aria-pressed="false">1100</button>
      <button data-w="820" aria-pressed="false">820</button>
      <button data-w="560" aria-pressed="false">560</button>
    </div>
  </div>

  <div class="spacer"></div>
  <span class="readout" id="readout">1500 × 940 · 100%</span>
  <a class="open" href="/agents/connections" target="_blank" rel="noopener">open the real page ↗</a>
</header>

<div class="stage">
  <div class="vp" id="vp">
    <iframe id="frame" title="Atlas connections, running"></iframe>
  </div>
  <p class="note">
    This frames the running page, so it is never a mock-up. Narrow the width to
    560 to see the three readouts stack; switch the theme to check both grounds.
  </p>
</div>

<script>
(function () {
  var FRAME_H = 940;
  var vp = document.getElementById("vp");
  var frame = document.getElementById("frame");
  var readout = document.getElementById("readout");
  var width = 1500;
  var theme = "dark";

  /* The app reads ?theme= before first paint, so a reload is how the frame
     changes theme -- there is no cross-document toggle to call. */
  function load() {
    frame.src = "/agents/connections?theme=" + theme;
  }

  function fit() {
    /* Scale to whatever room the stage actually has, never above 1:1: an
       upscaled frame would show a blurrier page than the one that ships. */
    var room = vp.parentElement.clientWidth - 48;
    var scale = Math.min(1, room / width);
    frame.style.width = width + "px";
    frame.style.height = FRAME_H + "px";
    frame.style.transform = "scale(" + scale + ")";
    vp.style.width = Math.round(width * scale) + "px";
    vp.style.height = Math.round(FRAME_H * scale) + "px";
    readout.textContent = width + " × " + FRAME_H + " · " + Math.round(scale * 100) + "%";
  }

  function press(nodes, match) {
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute("aria-pressed", String(match(nodes[i])));
    }
  }

  var themeBtns = document.querySelectorAll("[data-theme-set]");
  for (var i = 0; i < themeBtns.length; i++) {
    themeBtns[i].addEventListener("click", function (e) {
      theme = e.currentTarget.getAttribute("data-theme-set");
      document.documentElement.setAttribute("data-theme", theme);
      press(themeBtns, function (n) { return n.getAttribute("data-theme-set") === theme; });
      load();
    });
  }

  var wBtns = document.querySelectorAll("[data-w]");
  for (var j = 0; j < wBtns.length; j++) {
    wBtns[j].addEventListener("click", function (e) {
      width = Number(e.currentTarget.getAttribute("data-w"));
      press(wBtns, function (n) { return Number(n.getAttribute("data-w")) === width; });
      fit();
    });
  }

  window.addEventListener("resize", fit);
  load();
  fit();
})();
</script>
</body>
</html>
