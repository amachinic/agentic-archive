<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas — entering</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<style>
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Lite.ttf") format("truetype"); font-weight: 300; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #020202; overflow: hidden;
    color: #f0f0f0;
    font-family: "Neue Haas Unica", system-ui, sans-serif;
    font-weight: 300;
  }

  /* everything is pinned to fixed offsets from the window centre;
     nothing is laid out, nothing can shift */

  /* the dither field: it IS the logo at every stage, from noise to crisp */
  #px {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 240px;
  }

  /* the counter, a fixed distance under the mark */
  .pct {
    position: fixed;
    left: 50%; top: calc(50% + 162px);
    transform: translate(-50%, -50%);
    width: 4ch;
    text-align: center;
    font-family: "Input Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #8a8a8a;
    font-variant-numeric: tabular-nums;
  }

  .veil {
    position: fixed; inset: 0; background: #020202; opacity: 0; pointer-events: none;
    transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .veil.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="px"></canvas>
<div class="pct" id="pct">00%</div>
<div class="veil" id="veil"></div>

<script>
/* ============================================================
   Atlas preloader.
   One canvas, one object, no layers. During loading it is a field of
   dithering cells whose alpha lerps toward the mark as the counter climbs
   (number 0->100, image 0->100, same progress). The moment 100 lands the
   SAME field refines in place: the gaps between cells close, then the
   resolution rises continuously (log-space eased) from the grid to full
   until the pixels literally are the crisp mark. Nothing crossfades,
   nothing is swapped — it is a continuous sharpening of one image.
   Both elements are pinned to fixed offsets from the window centre.
   ============================================================ */

const pctEl = document.getElementById("pct");
const veil = document.getElementById("veil");

/* ---- the mark ---- */
const MARK = [
  "M48.38,104.3c18.97-19.86,30.51-46.8,32.49-75.87.46-6.75.34-13.84.23-20.71-.03-1.96-.06-3.9-.08-5.82l-.02-1.98H17.06C7.56-.07-.14,7.63-.14,17.13v117.07c18.58-5.7,35.06-15.81,48.52-29.9Z",
  "M157.38,137.46c-18.57-15.1-47.48-25.24-71.93-25.24-3.58,0-7.06.21-10.26.63-29.09,2.27-54.39,14.27-75.33,35.7v6.18c0,9.5,7.7,17.21,17.21,17.21h137.59c9.5,0,17.21-7.7,17.21-17.21v-3.77c-4.22-4.56-9.01-9.04-14.48-13.49Z",
  "M154.65-.07h-73.66l6.27.08s-.03,4.89-.04,6.37c-.07,9.19-.13,18.7.74,27.44,2.61,27.12,14.68,52.65,33.97,71.88,13.83,13.98,31.16,24.07,49.91,29.42V17.13C171.86,7.63,164.15-.07,154.65-.07Z",
];
const CUT = "M87.97,33.82c-.88-8.75-.81-18.25-.74-27.44.01-1.48.04-6.37.04-6.37l-6.27-.08.02,1.98c.02,1.92.05,3.86.08,5.82.11,6.86.23,13.96-.23,20.71-1.98,29.07-13.51,56.01-32.49,75.87-13.46,14.09-29.94,24.2-48.52,29.9v14.34c20.94-21.43,46.24-33.43,75.33-35.7,3.2-.41,6.68-.63,10.26-.63,24.45,0,53.36,10.15,71.93,25.24,5.47,4.45,10.26,8.93,14.48,13.49v-15.84c-18.75-5.35-36.08-15.44-49.91-29.42-19.29-19.22-31.36-44.75-33.97-71.88Z";

const GRID = 80;        /* the final dither grid, right before the sharpen */
const SIZE = 240;       /* css px of the field — every ladder rung divides it
                           exactly, so cells stay uniform at every resolution */
const STEP = 95;        /* ms per dither step */

/* display canvas, crisp on any dpr (snapped to 1 or 2 so cells stay integer) */
const canvas = document.getElementById("px");
const dpr = (window.devicePixelRatio || 1) >= 1.5 ? 2 : 1;
canvas.width = SIZE * dpr;
canvas.height = SIZE * dpr;
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);

/* rasterise the mark once at full device resolution, then build the mip
   ladder the refinement climbs; the coarsest mip doubles as the per-cell
   alpha targets for the dither, so the handoff between cell-rendering and
   mip-rendering is pixel-identical */
function markCanvas(res) {
  const cv = document.createElement("canvas");
  cv.width = res; cv.height = res;
  const c = cv.getContext("2d");
  c.scale(res / 172, res / 172);
  c.fillStyle = "#f0f0f0";
  for (const d of MARK) c.fill(new Path2D(d));
  c.globalCompositeOperation = "destination-out";
  c.fill(new Path2D(CUT));
  return cv;
}
const HIRES = SIZE * dpr;
const hi = markCanvas(HIRES);
/* the loading field climbs a ladder of grid sizes — low res to high res as
   the count rises. Every rung divides 240 exactly (30, 24, 20, 15, 12, 10,
   8, 6, 5, 4, 3px cells), so squares stay uniform at every resolution, and
   the rungs are close enough to read as one continuous climb. Each rung
   gets its own alpha targets sampled from the raster the sharpen ends on. */
const LADDER = [8, 10, 12, 16, 20, 24, 30, 40, 48, 60, 80];
const targetsByGrid = {};
for (const g of LADDER) {
  const cv = document.createElement("canvas");
  cv.width = g; cv.height = g;
  const c = cv.getContext("2d", { willReadFrequently: true });
  c.imageSmoothingEnabled = true;
  c.drawImage(hi, 0, 0, g, g);
  const d = c.getImageData(0, 0, g, g).data;
  const t = new Float32Array(g * g);
  for (let i = 0; i < g * g; i++) t[i] = d[i * 4 + 3] / 255;
  targetsByGrid[g] = t;
}

/* deterministic per-(cell, step) noise — same frame always renders the same */
function hash(a, b) {
  let h = (a * 374761393 + b * 668265263) >>> 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* loading look: dithering cells resolving toward the mark, at one rung of
   the resolution ladder. Does NOT clear — during a rung dissolve two rungs
   composite, the finer fading in over the coarser (layerA 0..1).
   closeT (0..1) shrinks the gaps/radius away for the handoff.
   introT (0..1) staggers each cell's birth: every pixel fades in at its own
   hash-random moment, keyed to the coarse first rung so the births stay
   spatially consistent while the resolution climbs. */
function drawCellsLayer(p, step, closeT, introT, G, layerA) {
  const t = targetsByGrid[G];
  const cell = SIZE / G;
  const gap = Math.max(1, Math.round(cell * 0.18)) * (1 - closeT);
  const rad = Math.max(1, Math.round(cell * 0.22)) * (1 - closeT);
  ctx.fillStyle = "#f0f0f0";
  for (let i = 0; i < G * G; i++) {
    const row = Math.floor(i / G), col = i % G;
    /* the static calms as the count rises, so the field settles into the
       mark instead of boiling right up until 100 */
    const noise = reduced ? 0 : (0.05 + hash(i, step) * 0.62) * (1 - 0.35 * p);
    let a = noise + (t[i] - noise) * p;
    if (introT < 1) {
      const K = LADDER[0];
      const key = Math.floor(row * K / G) * K + Math.floor(col * K / G);
      a *= Math.min(1, Math.max(0, (introT - hash(key, 7777) * 0.72) / 0.28));
    }
    a *= layerA;
    if (a < 0.015) continue;
    ctx.globalAlpha = a;
    const x = col * cell + gap / 2;
    const y = row * cell + gap / 2;
    const s = cell - gap;
    if (rad > 0.1 && ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(x, y, s, s, rad);
      ctx.fill();
    } else {
      ctx.fillRect(x, y, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

/* refinement look: the same raster redrawn at a CONTINUOUSLY rising
   resolution — no rungs, no jumps. Resolution climbs in log-space so the
   pixel size halves at a steady perceptual rate, and at e=1 the drawn
   image is the full-res crisp mark exactly. */
const tmp = document.createElement("canvas");
function drawRes(e) {
  const R = Math.min(HIRES, Math.round(GRID * Math.pow(HIRES / GRID, e)));
  tmp.width = R; tmp.height = R;
  const tc = tmp.getContext("2d");
  tc.imageSmoothingEnabled = true;
  tc.drawImage(hi, 0, 0, R, R);
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.imageSmoothingEnabled = R >= HIRES;
  ctx.drawImage(tmp, 0, 0, SIZE, SIZE);
}

/* ---- genuine loading ---- */
let unitsDone = 0;
let unitsTotal = 4;
const unit = () => { unitsDone += 1; };
function loadForReal() {
  const push = (p) => p.then(unit, unit);
  return Promise.all([
    push(fetch("/").then((r) => r.text())),
    push(fetch("/api/graph?min=0.82&mode=blend").then((r) => r.json())),
    push(fetch("/api/collections").then((r) => r.json())),
    push(
      fetch("/api/list?limit=120")
        .then((r) => r.json())
        .then((d) => {
          const first = (d.rows || []).slice(0, 24);
          unitsTotal += first.length;
          return Promise.all(first.map((row) => new Promise((res) => {
            const im = new Image();
            im.onload = im.onerror = () => { unit(); res(); };
            im.src = "/api/img/" + row.id;
          })));
        })
    ),
  ]);
}
loadForReal();

/* ---- exit ---- */
let leaving = false;
function leave() {
  if (leaving) return;
  leaving = true;
  /* mark the session booted BEFORE navigating, so the dashboard's boot
     redirect never sends us back here */
  try { sessionStorage.setItem("atlas-booted", "1"); } catch (e) {}
  veil.classList.add("on");
  setTimeout(() => location.replace("/"), 510);
}
addEventListener("pointerdown", leave);
addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") leave(); });

/* ---- run: number and image render 0 -> 100 together, then the pixels
        sharpen in place into the final mark, then hand over ---- */
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const LAND_MS = 350;    /* 100 rests, fully loaded, before the seal begins */
const CLOSE_MS = 110;   /* gaps between cells seal shut */
const REFINE_MS = 520;  /* resolution rises continuously to full */
const HOLD_MS = 600;    /* finished mark rests before the veil */
const INTRO_MS = 700;   /* the field itself assembles pixel by pixel */
const COUNT_MS = 2100;  /* the load-in takes at least this long, so the climb
                           through the resolution ladder gets room to breathe */
const TRAN_MS = 130;    /* dissolve between adjacent rungs: the finer grid
                           dithers in over the coarser one — no hard pops */

let shownPct = 0;
let doneAt = null;
let bornAt = null;
let rungIdx = 0;      /* current rung of the ladder */
let rungFrom = 0;     /* rung being dissolved away from */
let rungT0 = null;    /* dissolve start time, null when settled */

function frame(now) {
  requestAnimationFrame(frame);
  if (bornAt === null) bornAt = now;
  const introT = reduced ? 1 : Math.min(1, (now - bornAt) / INTRO_MS);

  if (doneAt === null) {
    /* honest progress, paced: never ahead of what is actually loaded, and
       never faster than the 4s timeline — a fast load stretches to 4s, a
       slow load takes as long as it takes */
    const timeCap = Math.min(100, ((now - bornAt) / COUNT_MS) * 100);
    const target = Math.min(timeCap, (unitsDone / Math.max(1, unitsTotal)) * 100);
    /* while loading, ease; once everything is truly in, sweep briskly to
       100 — fast enough not to stall, slow enough that the landing reads */
    const gain = target >= 100 ? 0.12 : 0.07;
    const floor = target >= 100 ? 0.9 : 0.5;
    shownPct = Math.min(target, shownPct + Math.max(floor, (target - shownPct) * gain));
    if (shownPct >= 99.5) {
      shownPct = 100;
      pctEl.textContent = "100%";
      doneAt = now;
    } else {
      pctEl.textContent = String(Math.floor(shownPct)).padStart(2, "0") + "%";
    }
    /* the resolution climbs the ladder as the count rises; each step up
       dissolves the finer grid in over the coarser one — seamless */
    const want = Math.min(LADDER.length - 1, Math.floor((shownPct / 100) * LADDER.length));
    if (want > rungIdx && rungT0 === null) {
      rungFrom = rungIdx;
      rungIdx = want;
      rungT0 = now;
    }
    const p = shownPct / 100;
    const step = Math.floor(now / STEP);
    ctx.clearRect(0, 0, SIZE, SIZE);
    if (rungT0 !== null) {
      const e = easeInOut(Math.min(1, (now - rungT0) / TRAN_MS));
      drawCellsLayer(p, step, 0, introT, LADDER[rungFrom], 1 - e);
      drawCellsLayer(p, step, 0, introT, LADDER[rungIdx], e);
      if (now - rungT0 >= TRAN_MS) rungT0 = null;
    } else {
      drawCellsLayer(p, step, 0, introT, LADDER[rungIdx], 1);
    }
    return;
  }

  const t = now - doneAt;
  if (t < LAND_MS) {
    /* fully loaded: the resolved matrix and the 100 rest together */
    ctx.clearRect(0, 0, SIZE, SIZE);
    drawCellsLayer(1, 0, 0, 1, GRID, 1);
  } else if (t < LAND_MS + CLOSE_MS) {
    ctx.clearRect(0, 0, SIZE, SIZE);
    drawCellsLayer(1, 0, easeOutCubic((t - LAND_MS) / CLOSE_MS), 1, GRID, 1);
  } else if (t < LAND_MS + CLOSE_MS + REFINE_MS) {
    drawRes(easeInOut((t - LAND_MS - CLOSE_MS) / REFINE_MS));
  } else {
    drawRes(1);
    if (t > LAND_MS + CLOSE_MS + REFINE_MS + HOLD_MS) leave();
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
