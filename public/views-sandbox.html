<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas — views sandbox</title>
<style>
  /* The same stand as the connections sandbox: it FRAMES the real pages, so
     what shows here is what ships, at any width and either theme. */
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Lite.ttf") format("truetype"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Neue Haas Unica"; src: url("/fonts/NHU-Reg.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Input Mono"; src: url("/fonts/InputMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  :root {
    --bg: #020202; --surface: #0d0d0d; --border: rgba(255,255,255,0.10); --border-strong: #555;
    --text: #f0f0f0; --text-2: #a3a3a3; --text-3: #7b7b7b; --accent: #fff; --on-accent: #020202;
    --sans: "Neue Haas Unica", Helvetica, Arial, sans-serif;
    --mono: "Input Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html[data-theme="light"] {
    --bg: #f8f8f8; --surface: #ffffff; --border: #e8e8e8; --border-strong: #c0c0c0;
    --text: #1a1a1a; --text-2: #555; --text-3: #7b7b7b; --accent: #020202; --on-accent: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 300; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 13px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex: none;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-weight: 400; font-size: 15px; }
  .brand span { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-3); }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > label { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-3); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: none; border: 0; cursor: pointer; padding: 6px 11px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; color: var(--text-2);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .spacer { margin-left: auto; }
  .readout { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .stage {
    flex: 1; min-height: 0; display: grid; place-items: start center; padding: 22px; overflow: auto;
    background: linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 100% 48px, var(--bg);
  }
  .vp { position: relative; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); box-shadow: 0 24px 60px rgba(0,0,0,0.35); }
  .vp iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: var(--bg); }
</style>
</head>
<body>

<header>
  <div class="brand"><b>Views</b><span>sandbox</span></div>

  <div class="group">
    <label>Page</label>
    <div class="seg" id="pages">
      <button data-page="gallery-wall" aria-pressed="true">wall</button>
      <button data-page="gallery-icons" aria-pressed="false">icons</button>
      <button data-page="gallery-details" aria-pressed="false">details</button>
      <button data-page="gallery-carousel" aria-pressed="false">carousel</button>
      <button data-page="analyze" aria-pressed="false">analyze</button>
    </div>
  </div>

  <div class="group">
    <label>Theme</label>
    <div class="seg" id="themes">
      <button data-t="dark" aria-pressed="true">dark</button>
      <button data-t="light" aria-pressed="false">light</button>
    </div>
  </div>

  <div class="group">
    <label>Width</label>
    <div class="seg" id="widths">
      <button data-w="1500" aria-pressed="true">1500</button>
      <button data-w="1100" aria-pressed="false">1100</button>
      <button data-w="700" aria-pressed="false">700</button>
    </div>
  </div>

  <div class="spacer"></div>
  <span class="readout" id="readout">1500 × 940 · 100%</span>
</header>

<div class="stage">
  <div class="vp" id="vp"><iframe id="frame" title="Atlas, running"></iframe></div>
</div>

<script>
(function () {
  var H = 940;
  var vp = document.getElementById("vp");
  var frame = document.getElementById("frame");
  var readout = document.getElementById("readout");
  var page = "gallery-wall", theme = "dark", width = 1500;

  function url() {
    /* id=1 pre-selects an image so the studio's full layout is on show */
    if (page === "analyze") return "/analyze?theme=" + theme + "&id=1";
    return "/gallery?theme=" + theme + "&view=" + page.replace("gallery-", "");
  }
  function load() { frame.src = url(); }
  function fit() {
    var room = vp.parentElement.clientWidth - 44;
    var scale = Math.min(1, room / width);
    frame.style.width = width + "px";
    frame.style.height = H + "px";
    frame.style.transform = "scale(" + scale + ")";
    vp.style.width = Math.round(width * scale) + "px";
    vp.style.height = Math.round(H * scale) + "px";
    readout.textContent = width + " × " + H + " · " + Math.round(scale * 100) + "%";
  }
  function wire(id, attr, fn) {
    var btns = document.getElementById(id).querySelectorAll("button");
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        btns.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        fn(b.getAttribute(attr));
      });
    });
  }
  wire("pages", "data-page", function (v) { page = v; load(); });
  wire("themes", "data-t", function (v) { theme = v; document.documentElement.setAttribute("data-theme", v); load(); });
  wire("widths", "data-w", function (v) { width = Number(v); fit(); });
  window.addEventListener("resize", fit);
  load(); fit();
})();
</script>
</body>
</html>
